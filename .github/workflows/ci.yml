name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr-number:
        description: PR number for a repair dispatch
        type: string
        default: ''
      expected-head-sha:
        description: Exact repaired PR commit
        type: string
        default: ''
      expected-default-sha:
        description: Exact default-branch commit requested after a checked merge
        type: string
        default: ''
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: edbfi/automation/actions/dispatch-guard@v1.2.0
        with:
          token: ${{ github.token }}
          pr-number: ${{ inputs.pr-number }}
          expected-head-sha: ${{ inputs.expected-head-sha }}
          expected-default-sha: ${{ inputs.expected-default-sha }}
  exports:
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: '0.12.15'
          enable-cache: true
      - name: Install ash parser
        run: |
          sudo apt-get update
          sudo apt-get install -y busybox
      - run: uv run --no-project --with-requirements .github/requirements.txt python .github/scripts/check-eggs.py
      - run: uv run --no-project --with-requirements .github/requirements.txt python .github/scripts/check-pair.py
      - run: python3 -m unittest discover -s tests -v
      - run: git diff --exit-code HEAD
  required:
    name: ci / required
    if: always()
    needs: [guard, exports]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: edbfi/automation/actions/dispatch-guard@v1.2.0
        with:
          token: ${{ github.token }}
          pr-number: ${{ inputs.pr-number }}
          expected-head-sha: ${{ inputs.expected-head-sha }}
          expected-default-sha: ${{ inputs.expected-default-sha }}
      - uses: edbfi/automation/actions/gate@v1.2.0
        with:
          needs: ${{ toJSON(needs) }}
          required: guard exports

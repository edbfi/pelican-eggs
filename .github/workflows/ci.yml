name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  exports:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: latest
          enable-cache: true
      - name: Log resolved runtime versions
        run: uv --version && python --version
      - name: Install ash parser
        run: |
          sudo apt-get update
          sudo apt-get install -y busybox
      - run: uv run --no-project --with-requirements .github/requirements.txt python .github/scripts/check-eggs.py
      - run: uv run --no-project --with-requirements .github/requirements.txt python .github/scripts/check-pair.py
      - run: python3 -m unittest discover -s tests -v
      - run: git diff --exit-code HEAD
  required:
    name: ci / required
    if: always()
    needs: [exports]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: edbfi/automation/actions/gate@v4.1.0
        with:
          needs: ${{ toJSON(needs) }}
          required: exports

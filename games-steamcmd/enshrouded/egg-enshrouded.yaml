description: |-
  Enshrouded is a game of survival, crafting and Action RPG combat on a voxel-based continent. This
  egg runs the Windows dedicated server under GE-Proton and manages the 1.0 enshrouded_server.json:
  server identity, difficulty preset, chat and the passwords of the four standard user groups.
